# /etc/nginx/sites-available/app.mailsfinder.com
# Reverse proxy for the self-hosted Next.js frontend (container on 127.0.0.1:3000).

upstream mailsfinder_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Trust Cloudflare so $remote_addr / X-Forwarded-For are the real visitor IP and
# not a Cloudflare edge node. Refresh from https://www.cloudflare.com/ips/
# (see deploy/DEPLOY.md step 6 for the one-liner that regenerates this list).
include /etc/nginx/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name app.mailsfinder.com;

    # certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.mailsfinder.com;

    ssl_certificate     /etc/letsencrypt/live/app.mailsfinder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.mailsfinder.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # next.config.ts sets serverActions.bodySizeLimit to 10mb for CSV uploads.
    # nginx defaults to 1m, which would reject them before Next.js ever sees them.
    client_max_body_size 20m;
    client_body_buffer_size 256k;

    # Bulk find/verify calls proxy through to the backend and can run long.
    # These are the timeouts Vercel's 10s function limit used to break.
    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;

    # Content-hashed build assets: safe to cache forever.
    location /_next/static/ {
        proxy_pass http://mailsfinder_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://mailsfinder_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
    }
}
